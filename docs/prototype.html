<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inZENtive Backoffice — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F5F3; --surface:#FFFFFF; --line:#E2DDD9; --line-strong:#CFC8C2;
  --slate:#1E2C36; --slate-2:#121A20; --ink:#0D0D0D; --ink-2:#646260; --ink-3:#8F8D8A;
  --accent:#586C7B; --accent-dark:#1E2C36; --warm:#928176;
  --ok-bg:#E8EFE8; --ok-fg:#3F5D45;
  --warn-bg:#F6EFE2; --warn-fg:#7A5B24;
  --bad-bg:#F4E7E5; --bad-fg:#7A3B33;
  --neu-bg:#EFEDEA; --neu-fg:#646260;
  --rail:248px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:Inter,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.rail{
  width:var(--rail);flex:0 0 var(--rail);background:var(--slate);color:#E6E2DD;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh
}
.brand{padding:26px 22px 22px;font-size:19px;letter-spacing:.06em;font-weight:500;color:#fff}
.brand small{display:block;font-size:12px;letter-spacing:.02em;color:#8DA0AE;margin-top:5px;font-weight:400;text-transform:none}
.nav{padding:6px 12px;flex:1}
.nav button{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:none;border:0;padding:11px 14px;border-radius:3px;
  color:#B9C4CC;font-size:15.5px;text-align:left;margin-bottom:1px
}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:#E6E2DD;color:var(--slate);font-weight:500}
.nav .count{
  font-size:12.5px;min-width:22px;height:20px;padding:0 6px;border-radius:10px;
  background:#7A5B24;color:#F6EFE2;display:grid;place-items:center;font-weight:500
}
.nav button.on .count{background:var(--slate);color:#fff}
.navgroup{padding:16px 14px 6px;font-size:11.5px;letter-spacing:.06em;color:#6E7F8C}
.rail footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;color:#7D8D99}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  display:flex;align-items:center;gap:14px;padding:12px 30px;background:var(--surface);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20
}
.search{flex:1;max-width:520px;position:relative}
.search input{
  width:100%;padding:10px 14px 10px 38px;font:inherit;font-size:15px;
  border:1px solid var(--line-strong);border-radius:3px;background:var(--paper)
}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:#fff}
.search svg{position:absolute;left:12px;top:13px;opacity:.5}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden}
.seg button{background:#fff;border:0;padding:7px 13px;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--slate);color:#fff}
.who{display:flex;align-items:center;gap:9px;border:1px solid var(--line-strong);border-radius:3px;padding:5px 11px 5px 6px;background:#fff}
.who .av{width:28px;height:28px;border-radius:50%;background:var(--warm);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:500}
.who select{border:0;background:none;font:inherit;font-size:14.5px;padding:2px}
.who select:focus{outline:none}

.page{padding:30px 34px 80px;max-width:1400px}
.page.wide{max-width:none;padding-left:20px;padding-right:20px}
.tablewrap{position:relative}
.tablewrap.scrolls:after{content:"";position:absolute;top:0;right:0;bottom:0;width:38px;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.96))}
.h1{font-size:27px;font-weight:500;letter-spacing:-.01em;margin:0}
.sub{color:var(--ink-2);font-size:14.5px;margin-top:4px}
.crumb{background:none;border:0;padding:0;color:var(--accent);font-size:14px;margin-bottom:12px}
.crumb:hover{text-decoration:underline}

/* ---------- worklist: the signature element ---------- */
.work{margin-top:26px;border-top:1px solid var(--line-strong)}
.work-row{display:flex;gap:26px;align-items:flex-start;padding:19px 4px;border-bottom:1px solid var(--line)}
.work-n{
  flex:0 0 66px;text-align:right;font-size:38px;line-height:1;font-weight:300;
  letter-spacing:-.02em;padding-top:2px
}
.work-n.attn{color:#7A5B24}
.work-n.bad{color:#7A3B33}
.work-n.calm{color:var(--ink-3)}
.work-body{flex:1;min-width:0}
.work-t{font-size:17px;line-height:1.4}
.work-d{color:var(--ink-2);font-size:14px;margin-top:4px}
.work-act{flex:0 0 150px;padding-top:3px;display:flex;justify-content:flex-end}
.work-act .btn{width:100%;text-align:center}
.allclear{padding:34px 4px;color:var(--ink-2);font-size:16px;border-bottom:1px solid var(--line)}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line-strong);background:#fff;border-radius:3px;
  padding:9px 15px;font-size:14.5px;color:var(--ink);white-space:nowrap
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--slate);border-color:var(--slate);color:#fff}
.btn.primary:hover{background:#0f1a22;color:#fff}
.btn.warn{background:#7A5B24;border-color:#7A5B24;color:#fff}
.btn.warn:hover{background:#63491b;color:#fff}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn[disabled]:hover{border-color:var(--line-strong);color:var(--ink)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- badges ---------- */
.b{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:3px;font-size:13px;white-space:nowrap;font-weight:500}
.b:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.b.ok{background:var(--ok-bg);color:var(--ok-fg)}
.b.warn{background:var(--warn-bg);color:var(--warn-fg)}
.b.bad{background:var(--bad-bg);color:var(--bad-fg)}
.b.neu{background:var(--neu-bg);color:var(--neu-fg)}
.b.flat:before{display:none}

/* ---------- tables ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{
  text-align:left;font-weight:500;color:var(--ink-2);font-size:13.5px;
  padding:10px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap;background:#fff
}
td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FBFAF9}
td.r,th.r{text-align:right}
.nm{font-weight:500}
.mut{color:var(--ink-2);font-size:13px}
.bill{white-space:nowrap}
.rowlink{cursor:pointer}

/* ---------- filters ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 14px;align-items:center}
.chip{border:1px solid var(--line-strong);background:#fff;border-radius:3px;padding:7px 13px;font-size:14px;color:var(--ink-2)}
.chip.on{background:var(--slate);border-color:var(--slate);color:#fff}
.chip .c{opacity:.6;margin-left:6px;font-size:13px}

/* ---------- panels / layout bits ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:3px;padding:20px 22px}
.panel h3{margin:0 0 14px;font-size:15px;font-weight:600}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 20px;font-size:14.5px}
.dl dt{color:var(--ink-2)}
.dl dd{margin:0}
.sectitle{font-size:15px;font-weight:600;margin:30px 0 12px}
.hint{font-size:13.5px;color:var(--ink-2);margin-top:5px}
.note{background:var(--warn-bg);border-left:3px solid #7A5B24;padding:13px 16px;font-size:14.5px;color:#5c4519;border-radius:0 3px 3px 0}
.note.bad{background:var(--bad-bg);border-color:#7A3B33;color:#6A342D}
.note.info{background:#EDF1F4;border-color:var(--accent);color:#33454F}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-strong);margin:22px 0 0}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 16px;font-size:15px;color:var(--ink-2);margin-bottom:-1px}
.tabs button.on{border-bottom-color:var(--slate);color:var(--ink);font-weight:500}
.cap{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.capbar{height:7px;background:var(--neu-bg);border-radius:4px;overflow:hidden;flex:1;max-width:260px}
.capbar i{display:block;height:100%;background:var(--accent)}
.capbar i.full{background:#7A3B33}

/* ---------- calc box ---------- */
.calc{border:1px solid var(--line-strong);border-radius:3px;background:#FCFBFA;padding:16px 18px;font-size:14.5px;max-width:420px}
.calc div{display:flex;justify-content:space-between;padding:5px 0}
.calc .rule{border-top:1px solid var(--line-strong);margin-top:7px;padding-top:9px;font-weight:600;font-size:16px}
.calc .off{color:var(--ok-fg)}

/* ---------- wizard ---------- */
.steps{display:flex;gap:0;margin:24px 0 26px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff}
.steps div{flex:1;padding:13px 16px;font-size:14px;color:var(--ink-3);border-right:1px solid var(--line);display:flex;gap:9px;align-items:center}
.steps div:last-child{border-right:0}
.steps div.on{background:var(--slate);color:#fff;font-weight:500}
.steps div.done{color:var(--ok-fg);background:#F6F9F6}
.steps .sn{width:21px;height:21px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:12px;flex:0 0 auto}
.field{margin-bottom:18px;max-width:560px}
.field label{display:block;font-size:14.5px;font-weight:500;margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 13px;font:inherit;font-size:15px;border:1px solid var(--line-strong);border-radius:3px;background:#fff
}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.radios{display:grid;gap:9px;max-width:560px}
.radio{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line-strong);border-radius:3px;padding:13px 15px;cursor:pointer;background:#fff}
.radio.on{border-color:var(--slate);background:#FAFAF9;box-shadow:inset 0 0 0 1px var(--slate)}
.radio input{margin-top:3px}
.radio .rt{font-size:15px}
.radio .rd{font-size:13.5px;color:var(--ink-2);margin-top:2px}

/* ---------- approval split ---------- */
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:start}
.doc{background:#fff;border:1px solid var(--line-strong);border-radius:3px;padding:34px 36px;font-size:13.5px;line-height:1.55}
.doc .logo{font-size:23px;letter-spacing:.04em;margin-bottom:22px}
.doc h4{font-size:17px;font-weight:500;margin:0 0 12px}
.doc table{font-size:13px}
.doc th{font-size:12.5px;padding:7px 8px}
.doc td{padding:8px}
.readonly{background:#FAFAF9}

/* ---------- misc ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--slate);color:#fff;
  padding:13px 20px;border-radius:3px;font-size:14.5px;display:flex;gap:16px;align-items:center;z-index:100;
  box-shadow:0 6px 24px rgba(0,0,0,.22)
}
.toast button{background:none;border:0;color:#9FD0A9;text-decoration:underline;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(13,13,13,.42);display:grid;place-items:center;z-index:200;padding:20px}
.modal .box{background:#fff;border-radius:4px;max-width:520px;width:100%;padding:26px 28px}
.modal h3{margin:0 0 12px;font-size:19px;font-weight:500}
.modal p{font-size:15px;line-height:1.55;margin:0 0 10px;color:#2b2b2b}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.ro-banner{background:#EDF1F4;border:1px solid #C6D2DA;color:#33454F;padding:11px 16px;border-radius:3px;font-size:14px;margin-bottom:20px}
.empty{padding:40px;text-align:center;color:var(--ink-2)}
.empty .btn{margin-top:14px}
.help ol{padding-left:20px;line-height:1.8;font-size:15px}
.help h3{margin:26px 0 8px;font-size:16px}
.k{font-size:12.5px;color:var(--ink-3);letter-spacing:.02em}

/* icons */
.ico{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.6;
     stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav button .ico{opacity:.7}
.nav button.on .ico,.nav button:hover .ico{opacity:1}
.nav button{gap:11px}
.nav button>span:first-of-type{flex:1}
.ico-sm{width:15px;height:15px;flex:0 0 15px;stroke-width:1.7}

/* tooltip */
.tip{position:relative;display:inline-flex;vertical-align:middle;margin-left:5px}
.tip>button{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-strong);
  background:#fff;color:var(--ink-3);font-size:11px;line-height:1;display:grid;place-items:center;padding:0}
.tip>button:hover,.tip>button:focus{background:var(--slate);border-color:var(--slate);color:#fff;outline:none}
.tip .bub{
  position:fixed;left:0;top:0;width:268px;background:var(--slate);color:#EDEAE6;
  padding:11px 13px;border-radius:4px;font-size:13.5px;line-height:1.5;font-weight:400;
  text-align:left;z-index:300;box-shadow:0 8px 26px rgba(0,0,0,.28);
  opacity:0;visibility:hidden;pointer-events:none;white-space:normal}
.tip:hover .bub,.tip>button:focus+.bub,.tip.open .bub{opacity:1;visibility:visible}
th .tip>button{width:15px;height:15px;font-size:10px}

/* intro banner */
.intro{background:#fff;border:1px solid var(--line-strong);border-left:3px solid var(--accent);
  border-radius:3px;padding:18px 20px;margin-bottom:26px;position:relative}
.intro h3{margin:0 0 8px;font-size:16px;font-weight:600}
.intro p{margin:0 0 8px;font-size:14.5px;line-height:1.6;color:#2b2b2b}
.intro ul{margin:8px 0 0;padding-left:18px;font-size:14.5px;line-height:1.75;color:#2b2b2b}
.intro .x{position:absolute;top:12px;right:12px;background:none;border:0;color:var(--ink-3);font-size:18px;line-height:1;padding:4px 8px}
.intro .x:hover{color:var(--ink)}

/* certificate sheet */
.cert{background:#fff;border:1px solid var(--line-strong);padding:44px 48px;text-align:center;max-width:620px}
.cert .ctitle{font-size:27px;letter-spacing:.14em;font-weight:600;color:#4a4a4a}
.cert .csub{font-size:13px;letter-spacing:.18em;color:#8F8D8A;margin-top:4px}
.cert .cname{font-size:25px;font-style:italic;font-weight:600;margin:26px 0 6px}
.cert .clogo{font-size:27px;letter-spacing:.04em;margin:22px 0}
.cert .cprog{font-size:20px;font-weight:600;color:#4a4a4a}
.cert .cmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;text-align:left;
  margin:26px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px}
.cert .cmeta .k{display:block}
.cert .cfoot{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
@media (max-width:1080px){
  .split{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media (max-width:860px){
  .rail{position:fixed;left:-260px}
  .page{padding:20px 16px 70px}
  .work-n{flex-basis:48px;font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const CERT_WARN_DAYS = 90;

/* the certificate records an achievement and never expires.
   the licence attached to it can. state() reads the licence. */
function credState(c){
  if(c.st==="revoked")  return {k:"revoked"};
  if(c.st==="reissued") return {k:"reissued"};
  if(!c.until)          return {k:"noexpiry"};
  const d = daysBetween(parseDE(c.until), TODAY);
  if(d < 0)                 return {k:"expired", d};
  if(d <= CERT_WARN_DAYS)   return {k:"expiring", d};
  return {k:"ok", d};
}
function credBadge(c){
  const s = credState(c);
  const de = LANG==="de";
  if(s.k==="revoked")  return `<span class="b bad">${de?"Widerrufen":"Revoked"}</span>`;
  if(s.k==="reissued") return `<span class="b neu">${de?"Ersetzt":"Superseded"}</span>`;
  if(s.k==="noexpiry") return `<span class="b ok flat">${de?"Kein Ablauf":"No expiry"}</span>`;
  if(s.k==="expired")  return `<span class="b bad">${de?"Abgelaufen":"Expired"}</span>`;
  if(s.k==="expiring") return `<span class="b warn">${de?"Läuft bald ab":"Expiring"}</span>`;
  return `<span class="b ok">${de?"Gültig":"Valid"}</span>`;
}
const credRemain = c => {
  const s = credState(c), de = LANG==="de";
  if(s.k==="noexpiry") return `<span class="mut">—</span>`;
  if(s.k==="revoked"||s.k==="reissued") return `<span class="mut">—</span>`;
  if(s.d < 0) return `<span style="color:#7A3B33">${Math.abs(s.d)} ${de?"Tage überfällig":"days ago"}</span>`;
  return `${s.d} ${de?"Tage":"days"}`;
};
const credsExpiring = () => CREDS.filter(c=>["expiring","expired"].includes(credState(c).k)).length;

function memberState(m){
  const end = parseDE(m.e);
  if(m.st==="pending") return {k:"pending", label:LANG==="de"?"Zu prüfen":"To verify", cls:"warn"};
  const dd = daysBetween(end, TODAY);
  if(dd < 0) return {k:"expired", label:`Classroom ${t("expired")} — ${t("since")} ${m.e}`, cls:"bad", d:dd};
  if(dd <= 30) return {k:"expiring", label:`Classroom ${t("active")} — ${t("validUntil")} ${m.e}`, cls:"warn", d:dd};
  return {k:"active", label:`Classroom ${t("active")} — ${t("validUntil")} ${m.e}`, cls:"ok", d:dd};
}
function cmState(until){
  if(!until) return "none";

        <div class="calc">
          <div><span>${t("basePrice")}</span><span class="num">${money(base,cur)}</span></div>
          <div><span>${t("classDisc")}</span><span class="num mut">${LANG==="de"?"nicht anwendbar":"not applicable"}</span></div>
          <div class="mut" style="padding-top:0;font-size:13px">${noDisc

            if(!c.applies.includes(evProg)) return `<div class="hint" style="color:#7A5B24">${LANG==="de"?`Gilt für ${progNames(c.applies)}, nicht für ${evName}.`:`Applies to ${progNames(c.applies)}, not to ${evName}.`}</div>`;
            if(c.onePerPerson) return `<div class="hint" style="color:#3F5D45">${LANG==="de"?`${c.pct} % · Kampagne ${c.note.split(" — ")[0]} · einmal pro Person, wird bei der Freigabe gegen die Liste geprüft`:`${c.pct}% · campaign ${c.note.split(" — ")[0]} · once per person, checked against the list at approval`}</div>`;
            return `<div class="hint" style="color:#3F5D45">${LANG==="de"?`${c.pct} % · ${c.kind==="personal"?"zugesagt von Robert am "+c.made_on+(c.for?", für "+c.for:""):"Kampagne "+c.note}`:`${c.pct}% · ${c.kind==="personal"?"promised by Robert on "+c.made_on+(c.for?", for "+c.for:""):"campaign "+c.note}`}</div>`;
          })()}
          ${!wizCode.trim()?`<div style="margin-top:8px"><button class="btn sm" style="border:0;padding:0;color:var(--accent);text-decoration:underline" onclick="wizClaim=!wizClaim;render()">${LANG==="de"?"Robert hat mir einen Rabatt zugesagt, ich habe aber keinen Code":"Robert promised me a discount but I have no code"}</button></div>`:""}
          ${wizClaim&&!wizCode.trim()?`<div class="field" style="margin-top:10px;margin-bottom:0">
            <textarea rows="2" placeholder="${LANG==="de"?"Wo und wann? Ungefähr reicht.":"Where and when? Roughly is enough."}"></textarea>
            <div class="hint">${LANG==="de"?"Wird nicht automatisch angewendet. Gudrun prüft es mit Robert vor der Rechnung.":"Not applied automatically. Gudrun checks it with Robert before the invoice."}</div>
          </div>`:""}
        </div>
        <div class="field" style="margin-top:20px">
          <label>${t("indivDisc")} (%)</label>

        <dl class="dl">
          <dt>${LANG==="de"?"Teilnehmerin":"Participant"}</dt><dd>${wizard.person||"Sonja Weiss"}</dd>

          <dt>${t("billTo")}</dt><dd>${wizard.billing==="company"?"Smith Fitness GmbH":(wizard.person||"Sonja Weiss")}</dd>
          <dt>${t("finalPrice")}</dt><dd class="num">${money(finAll,cur)}</dd>
        </dl>
        <div class="note info" style="margin-top:16px">${LANG==="de"
          ? "Beim Speichern wird ein Rechnungs<strong>entwurf</strong> vorbereitet. Es wird nichts versendet und keine Nummer vergeben."

      </div>
    </div>`;
  }

  return `<div class="page">

/* ---------------- CREDENTIALS ---------------- */
function pageCerts(){
  const f = credFilter;
  const rows = CREDS.filter(c => {
    const k = credState(c).k;
    if(f==="all") return true;
    if(f==="expiring") return k==="expiring"||k==="expired";
    if(f==="revoked")  return k==="revoked"||k==="reissued";
    return c.prog===f;
  }).sort((a,b)=>{
    const ka=credState(a), kb=credState(b);
    const rank = x => ({expired:0,expiring:1,ok:2,noexpiry:3,reissued:4,revoked:5})[x.k];
    if(rank(ka)!==rank(kb)) return rank(ka)-rank(kb);
    return (a.until?parseDE(a.until):0) - (b.until?parseDE(b.until):0);
  });
  const n = code => CREDS.filter(c=>c.prog===code && ["ok","expiring","noexpiry"].includes(credState(c).k)).length;
  const chip = (k,l,c) => `<button class="chip ${f===k?'on':''}" onclick="credFilter='${k}';render()">${l}${c!==undefined?`<span class="c">${c}</span>`:""}</button>`;
  const holders = new Set(CREDS.filter(c=>["ok","expiring","noexpiry"].includes(credState(c).k)).map(c=>c.who)).size;

  return `<div class="page wide">
    <h1 class="h1">${LANG==="de"?"Zertifikate und Lizenzen":"Certificates and licences"}</h1>
    <div class="sub">${LANG==="de"
      ? `${holders} Personen mit mindestens einer gültigen Qualifikation · ${credsExpiring()} Lizenzen laufen ab oder sind abgelaufen`
      : `${holders} people hold at least one valid qualification · ${credsExpiring()} licences are expiring or expired`}</div>

    <div class="filters">
      ${chip("expiring",LANG==="de"?"Läuft ab oder abgelaufen":"Expiring or expired",credsExpiring())}${tip("licvalid")}
      ${chip("all",LANG==="de"?"Alle":"All",CREDS.length)}
      ${PROGRAMS.map(p=>chip(p.code,p.name,n(p.code))).join("")}
      ${chip("revoked",LANG==="de"?"Widerrufen und ersetzt":"Revoked and superseded",CREDS.filter(c=>["revoked","reissued"].includes(credState(c).k)).length)}
      <div style="flex:1"></div>
      <button class="btn sm">${t("export")}</button>
    </div>

    <div class="card"><div class="tablewrap"><table>
      <thead><tr>
        <th>${t("name")}</th>
        <th>${LANG==="de"?"Ausbildung":"Education"}</th>
        <th>${LANG==="de"?"Lizenznummer":"Licence number"}${tip("licence")}</th>
        <th>${LANG==="de"?"Zertifikatsnummer":"Certificate number"}${tip("certno")}</th>
        <th>${LANG==="de"?"Abschluss":"Completed"}</th>
        <th>${LANG==="de"?"Dauer":"Duration"}</th>
        <th>${LANG==="de"?"Lizenz gültig bis":"Licence valid until"}${tip("licvalid")}</th>
        <th>${LANG==="de"?"Verbleibend":"Remaining"}</th>
        <th>${t("location")}</th>
        <th>Status</th><th></th>
      </tr></thead>
      <tbody>${rows.map(c=>{
        const p = progOf(c.prog);
        const note = LANG==="de"?c.note_de:c.note_en;
        return `<tr>
          <td class="nm">${c.who}</td>
          <td>${p.name}<div class="mut">${p.fam}</div></td>
          <td class="num nm">${c.lic || `<span class="mut">${LANG==="de"?"keine Lizenz":"no licence"}</span>`}</td>
          <td class="num">${c.cert}${note?`<div class="mut">${note}</div>`:""}</td>
          <td class="num">${c.date}</td>
          <td class="num">${c.days} ${LANG==="de"?"Tage":"days"}</td>
          <td class="num">${c.until || `<span class="mut">—</span>`}</td>
          <td class="num">${credRemain(c)}</td>
          <td>${c.place}</td>
          <td>${credBadge(c)}</td>
          <td class="r"><button class="btn sm" onclick="go('cert',{c:'${c.cert}'})">${LANG==="de"?"Ansehen":"View"}</button></td>
        </tr>`}).join("")}
      </tbody></table></div></div>

    <div class="note" style="margin-top:20px">${LANG==="de"
      ? "<strong>Abschluss und Lizenz sind zwei Dinge.</strong> Das Zertifikat hält fest, dass jemand die Ausbildung abgeschlossen hat — das läuft nie ab. Die Lizenz ist das Recht, in der Methode zu unterrichten, und die muss verlängert werden. HeartMath und bodyART verlängern selbst; wir halten es nur fest."
      : "<strong>Completion and licence are two different things.</strong> The certificate records that somebody completed the education — that never expires. The licence is the right to teach in the method, and it has to be renewed. HeartMath and bodyART renew their own; we only record it."}</div>

    <div class="note info" style="margin-top:14px">${LANG==="de"
      ? "<strong>Prüfbarkeit:</strong> jede Nummer ist unter inzentive.net/verify/NUMMER öffentlich prüfbar. Ein Studio, das eine Trainerin einstellt, sieht Name, Ausbildung und Datum — und bei widerrufenen Zertifikaten, dass sie ungültig sind."
      : "<strong>Verifiable:</strong> every number can be checked publicly at inzentive.net/verify/NUMBER. A studio hiring a coach sees the name, the education and the date — and for revoked certificates, that they are invalid."}</div>
  </div>`;
}

            <button class="btn" onclick="say('${LANG==="de"?"Neu ausgestellt, Lizenznummer bleibt":"Reissued, licence number unchanged"}',true)">${LANG==="de"?"Neu ausstellen":"Reissue"}</button>
            ${c.until&&p.issuer==="inZENtive"?`<button class="btn warn" onclick="say('${LANG==="de"?"Lizenz um 24 Monate verlängert":"Licence renewed for 24 months"}',true)">${LANG==="de"?"Lizenz verlängern":"Renew licence"}</button>`:""}`:""}

function askCancel(refund, stillOwed){
  const de = LANG==="de";
  modal = cancelMode==="cancel" ? {
    title: de?"Anmeldung stornieren?":"Cancel this registration?",
    body: de
      ? `Die Anmeldung von Beata Tothova wird storniert.${refund>0?` Eine Gutschrift über ${money(refund,"EUR")} wird zur Freigabe vorbereitet, die Rückzahlung auf den ursprünglichen Zahlungsweg zur Ausführung im E-Banking.`:` Es gibt keine Rückzahlung.`}${stillOwed>0?` Die Schlussrechnung über ${money(stillOwed,"EUR")} bleibt fällig.`:""}<br><br>Der Platz wird frei und die erste Person auf der Warteliste wird dir vorgeschlagen.`
      : `The registration of Beata Tothova is cancelled.${refund>0?` A credit note for ${money(refund,"EUR")} is prepared for approval, and the refund to the original payment method for you to execute in e-banking.`:` There is no refund.`}${stillOwed>0?` The final invoice for ${money(stillOwed,"EUR")} remains due.`:""}<br><br>The place is freed and the first person on the waiting list is proposed to you.`,
    ok: de?"Stornieren":"Cancel registration",
    act: () => { modal=null; go("event",{id:"immersion"}); say(de?"Storniert":"Cancelled", true); }
  } : {
    title: de?"Platz übertragen?":"Transfer the place?",
    body: de
      ? `Der Platz von Beata Tothova geht an <strong>${transferTo}</strong>. Rechnung und Zahlung bleiben bei Beata. ${transferTo} bekommt das Factsheet und die Gesundheitserklärung mit Frist 72 Stunden vor dem Check-in.<br><br>Ohne abgegebene Gesundheitserklärung ist der übertragene Platz laut AGB nicht gültig — das System erinnert dich daran.`
      : `Beata Tothova's place goes to <strong>${transferTo}</strong>. Invoice and payment stay with Beata. ${transferTo} receives the fact sheet and the health declaration with a deadline 72 hours before check-in.<br><br>Without a submitted health declaration the transferred place is not valid under the T&C — the system reminds you.`,
    ok: de?"Übertragen":"Transfer",
    act: () => { modal=null; go("event",{id:"immersion"}); say(de?"Platz übertragen, Gesundheitserklärung angefordert":"Place transferred, health declaration requested", true); }
  };
  render();
}

      </div>
      <div class="btnrow" style="margin-top:18px">
        <button class="btn" onclick="promise={pct:15,applies:'BC',who:'',note:'',stack:false,done:false,code:''};render()">${de?"Noch einen zusagen":"Promise another"}</button>
        <button class="btn" onclick="go('codes')">${de?"Zu den Codes":"To the codes"}</button>
      </div>
    </div>`;
  }
  const pctBtn = v => `<button class="chip ${p.pct===v?'on':''}" style="font-size:17px;padding:12px 18px" onclick="promise.pct=${v};render()">${v}%</button>`;
  return `<div class="page" style="max-width:560px">
    <h1 class="h1">${de?"Rabatt zusagen":"Promise a discount"}</h1>
    <div class="sub">${ROLE==="robert"
      ? (de?"Drei Antworten, dann hast du einen Code zum Weiterschicken.":"Three answers, then you have a code to pass on.")
      : (de?"Wenn Robert dich anruft mit „gib Nadine 15 %“ — drei Antworten, und der Code geht direkt an sie.":"When Robert calls you with \"give Nadine 15%\" — three answers, and the code goes straight to her.")}</div>

    <div class="panel" style="margin-top:22px">
      <h3>${de?"Wie viel?":"How much?"}</h3>
      <div class="filters" style="margin:0">${[10,15,20,25].map(pctBtn).join("")}</div>
    </div>

    <div class="panel" style="margin-top:14px">
      <h3>${de?"Worauf?":"On what?"}</h3>
      <div class="radios">
        ${PROGRAMS.filter(x=>x.issuer==="inZENtive").map(x=>`
          <label class="radio ${p.applies===x.code?'on':''}" onclick="promise.applies='${x.code}';render()">
            <input type="radio" ${p.applies===x.code?"checked":""}><span><span class="rt">${x.name}</span></span></label>`).join("")}
      </div>
    </div>

    <div class="panel" style="margin-top:14px">
      <h3>${de?"Für wen?":"For whom?"} <span class="mut" style="font-weight:400">(${de?"optional":"optional"})</span></h3>
      <div class="field" style="margin-bottom:10px">
        <input placeholder="${de?'z. B. Nadine, Sandras Freundin':'e.g. Nadine, Sandra\'s friend'}" value="${p.who}" oninput="promise.who=this.value">
      </div>
      <div class="field" style="margin-bottom:0">
        <input placeholder="${de?'Wo habt ihr euch getroffen?':'Where did you meet?'}" value="${p.note}" oninput="promise.note=this.value">
      </div>
      <div class="hint" style="margin-top:8px">${de
        ? "Kein Name, keine E-Mail nötig. Der Code identifiziert die Person, wenn sie sich anmeldet."
        : "No name and no email needed. The code identifies the person when they register."}</div>
    </div>

    <div class="hint" style="margin:12px 0 0 4px">${de
      ? "Codes gelten nie für Festpreis-Veranstaltungen wie den Summer Summit — dort wird jeder Code abgelehnt."
      : "Codes never apply to fixed-price events such as the Summer Summit — any code is refused there."}</div>

    <div class="panel" style="margin-top:14px">
      <label class="radio ${p.stack?'on':''}" onclick="promise.stack=!promise.stack;render()" style="border:0;padding:0;background:none;box-shadow:none">
        <input type="checkbox" ${p.stack?"checked":""}>
        <span><span class="rt">${de?"Zusätzlich zum Classroom-Rabatt":"On top of the Classroom discount"}</span>
        <span class="rd">${de?"Sonst gilt der bessere von beiden.":"Otherwise the better of the two applies."}</span></span>
      </label>
    </div>

    <div class="btnrow" style="margin-top:20px">
      <button class="btn primary" style="padding:13px 22px;font-size:16px" onclick="promise.code=genCode();promise.done=true;render()">${de?"Code erstellen":"Create code"}</button>
      <button class="btn" onclick="go('today')">${t("cancel")}</button>
    </div>
  </div>`;
}

/* ---------------- CODES REGISTER ---------------- */
function pageCodes(){
  const de = LANG==="de";
  const f = codeFilter;
  const rows = CODES.filter(c=>{
    if(f==="all") return true;
    if(f==="open") return c.kind==="personal" && c.status==="active";
    if(f==="campaign") return c.kind==="campaign";
    if(f==="personal") return c.kind==="personal";
    if(f==="done") return c.status!=="active";
  }).sort((a,b)=>{
    const r = x => x.status==="active" ? (x.kind==="personal"?0:1) : 2;
    return r(a)-r(b) || parseDE(b.made_on)-parseDE(a.made_on);
  });
  const chip = (k,l,n) => `<button class="chip ${f===k?'on':''}" onclick="codeFilter='${k}';render()">${l}${n!==undefined?`<span class="c">${n}</span>`:""}</button>`;
  const totalRev = CODES.reduce((a,c)=>a+c.revenue,0);

  return `<div class="page wide">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
      <div>
        <h1 class="h1">${de?"Rabattcodes":"Discount codes"}</h1>
        <div class="sub">${de
          ? `${CODES.reduce((a,c)=>a+c.used,0)} Einlösungen · ${money(totalRev,"EUR")} Umsatz über Codes · ${openPromises()} Zusagen offen`
          : `${CODES.reduce((a,c)=>a+c.used,0)} redemptions · ${money(totalRev,"EUR")} revenue through codes · ${openPromises()} promises open`}</div>
      </div>
      <div class="btnrow">
        <button class="btn primary" onclick="go('promise')">${de?"Rabatt zusagen":"Promise a discount"}</button>
        ${ROLE==="gudrun"?`<button class="btn">${de?"Kampagnencode anlegen":"Create campaign code"}</button>`:""}
      </div>
    </div>

    <div class="filters">
      ${chip("open",de?"Zugesagt, noch offen":"Promised, still open",openPromises())}${tip("personal")}
      ${chip("all",de?"Alle":"All",CODES.length)}
      ${chip("campaign",de?"Kampagnen":"Campaigns",CODES.filter(c=>c.kind==="campaign").length)}
      ${chip("personal",de?"Persönlich":"Personal",CODES.filter(c=>c.kind==="personal").length)}
      ${chip("done",de?"Eingelöst oder abgelaufen":"Used or expired",CODES.filter(c=>c.status!=="active").length)}
    </div>

    <div class="card"><div class="tablewrap"><table>
      <thead><tr>
        <th>Code</th><th>${de?"Art":"Kind"}</th><th class="r">${de?"Rabatt":"Discount"}</th>
        <th>${de?"Gilt für":"Applies to"}</th><th>${de?"Für":"For"}</th>
        <th>${de?"Erstellt":"Made"}</th><th>${de?"Gültig bis":"Valid until"}</th>
        <th class="r">${de?"Eingelöst":"Used"}</th><th class="r">${de?"Umsatz":"Revenue"}</th><th>Status</th>
      </tr></thead>
      <tbody>${rows.map(c=>`<tr>
        <td class="num nm" style="letter-spacing:.04em">${c.code}${c.stackable?`<div class="mut">${de?"kombinierbar":"combinable"}</div>`:""}${c.onePerPerson?`<div class="mut">${de?"1× pro Person":"1× per person"}${tip("onePerPerson")}</div>`:""}</td>
        <td>${c.kind==="campaign"?(de?"Kampagne":"Campaign"):(de?"Persönlich":"Personal")}</td>
        <td class="r num">${c.pct}%</td>
        <td>${progNames(c.applies)}</td>
        <td>${c.for?`<div>${c.for}</div>`:""}<div class="mut">${c.note}</div>${c.used_by?`<div class="mut">${de?"eingelöst von":"used by"} ${c.used_by}, ${c.used_on}</div>`:""}</td>
        <td class="num">${c.made_on}<div class="mut">${c.made_by}${c.sent?` · ${c.sent}`:""}</div></td>
        <td class="num">${c.until}</td>
        <td class="r num">${c.used}${c.kind==="campaign"?` / ${c.max}`:""}</td>
        <td class="r num">${c.revenue?money(c.revenue,"EUR"):"—"}</td>
        <td>${codeStatusBadge(c)}</td>
      </tr>`).join("")}</tbody></table></div></div>

    ${CODE_CLAIMS.length?`
    <div class="sectitle">${de?"Zusagen ohne Code":"Promises without a code"}${tip("claim")}</div>
    <div class="card"><div class="tablewrap"><table><tbody>${CODE_CLAIMS.map(x=>`<tr>
      <td><div class="nm">${x.who}</div><div class="mut">${x.em} · ${x.ev}</div></td>
      <td style="max-width:420px"><div class="mut" style="font-style:italic">„${x.note}"</div>${x.hint?`<div style="margin-top:6px"><span class="b warn flat">${de?"Gegen die Inside-Yoga-Liste prüfen":"Check against the Inside Yoga list"}</span></div>`:""}</td>
      <td class="num mut">${x.on}</td>
      <td class="r">${ROLE==="gudrun"?`<div class="btnrow" style="justify-content:flex-end"><button class="btn sm" onclick="say('${de?"Robert gefragt":"Robert asked"}')">${de?"Robert fragen":"Ask Robert"}</button><button class="btn sm primary" onclick="say('${de?"10 % übernommen, Grund gespeichert":"10% applied, reason saved"}',true)">${de?"Übernehmen":"Apply"}</button></div>`
        :`<button class="btn sm primary" onclick="say('${de?"Bestätigt, Gudrun übernimmt":"Confirmed, Gudrun applies it"}',true)">${de?"Ja, stimmt":"Yes, correct"}</button>`}</td>
    </tr>`).join("")}</tbody></table></div></div>`:""}

    <div class="note" style="margin-top:20px">${de
      ? "<strong>Inside Yoga — die handschriftliche Liste:</strong> ein Kampagnencode <strong>INSIDEYOGA</strong>, 10 %, einmal pro Person, an die neun geht, die du identifizieren kannst. Die anderen fünf müssen nicht erraten werden: wer sich anmeldet und angibt, dabei gewesen zu sein, landet mit vollem Namen und E-Mail als Zusage ohne Code bei dir — dann prüfst du gegen die Liste, nicht umgekehrt."
      : "<strong>Inside Yoga — the handwritten list:</strong> one campaign code <strong>INSIDEYOGA</strong>, 10%, once per person, sent to the nine you can identify. The other five do not have to be guessed: whoever registers and says they were there lands with you as a claim without a code, full name and email attached — then you check against the list, not the other way round."}</div>

    <div class="note info" style="margin-top:14px">${de
      ? "<strong>Warum ein Code und keine Auswahlliste:</strong> eine Frage wie „Warst du auf einer Veranstaltung mit Rabatt?“ kann jeder mit Ja beantworten, und das System kann es nicht prüfen. Ein Code ist selbst der Beleg. Und weil Robert ihn im Moment der Zusage erstellt, gibt es nichts mehr abzugleichen — kein Excel, kein WhatsApp-Suchen."
      : "<strong>Why a code and not a dropdown:</strong> a question like \"Did you attend an event with a discount?\" can be answered yes by anyone, and the system cannot check it. A code is proof by itself. And because Robert creates it the moment he makes the promise, there is nothing left to match — no Excel, no searching through WhatsApp."}</div>
  </div>`;
}

/* ---------------- WEBSITE CONNECTION ---------------- */
function pageSync(){
  const de = LANG==="de";
  const tabBtn = (k,l) => `<button class="${syncTab===k?'on':''}" onclick="syncTab='${k}';render()">${l}</button>`;
  const ownerBadge = o => o==="cms" ? `<span class="b ok flat">${de?"Backoffice":"Back office"}</span>`
                        : o==="web" ? `<span class="b neu flat">${de?"Website":"Website"}</span>`
                        : `<span class="b warn flat">${de?"Beide":"Both"}</span>`;
  let body = "";
  if(syncTab==="log"){
    body = `<div class="card" style="margin-top:18px"><div class="tablewrap"><table>
      <thead><tr><th>${de?"Wann":"When"}</th><th></th><th>${de?"Was":"What"}</th><th>Status</th><th></th></tr></thead>
      <tbody>${SYNC.map(x=>`<tr style="${x.st==="failed"?'background:#FBF3F2':''}">
        <td class="num mut" style="white-space:nowrap">${x.t}</td>
        <td style="white-space:nowrap"><span class="mut">${x.dir==="in"?"←":"→"}</span> ${x.sys}</td>
        <td><div class="nm">${de?x.de:x.en}</div><div class="mut">${de?x.detDe:x.detEn}</div></td>
        <td>${x.st==="ok"?`<span class="b ok flat">ok</span>`:`<span class="b bad">${de?"Fehlgeschlagen":"Failed"}</span>`}</td>
        <td class="r">${x.st==="failed"&&ROLE==="gudrun"?`<button class="btn sm primary" onclick="say('${de?"Erneut gesendet — gelungen":"Sent again — succeeded"}')">${de?"Erneut senden":"Retry now"}</button>`:""}</td>
      </tr>`).join("")}</tbody></table></div></div>
      <div class="hint" style="margin-top:10px">${de?"← von der Website ins Backoffice · → vom Backoffice zur Website oder zu LearnDash":"← from the website into the back office · → from the back office to the website or LearnDash"}</div>`;
  } else {
    body = `<div class="card" style="margin-top:18px"><div class="tablewrap"><table>
      <thead><tr><th>${de?"Was":"What"}</th><th>${de?"Wem gehört es":"Who owns it"}${tip("ownership")}</th><th>${de?"Die andere Seite bekommt":"The other side gets"}</th></tr></thead>
      <tbody>${OWNERSHIP.map(o=>`<tr>
        <td class="nm">${de?o.de:o.en}</td>
        <td>${ownerBadge(o.owner)}<div class="mut" style="margin-top:4px">${de?o.ownerDe:o.ownerEn}</div></td>
        <td class="mut">${de?o.otherDe:o.otherEn}</td>
      </tr>`).join("")}</tbody></table></div></div>
      <div class="note info" style="margin-top:18px">${de
        ? "<strong>Die eine Regel:</strong> korrigiere Daten dort, wo sie leben. Ein Preis wird hier geändert, eine Kursbeschreibung in WordPress, eine Adresse hier oder von der Person selbst. Wer die Kopie korrigiert, verliert die Korrektur beim nächsten Abgleich."
        : "<strong>The one rule:</strong> fix data where it lives. A price is changed here, a course description in WordPress, an address here or by the person themselves. Whoever corrects the copy loses the correction at the next sync."}</div>`;
  }
  return `<div class="page">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <div><h1 class="h1">${de?"Website-Verbindung":"Website connection"}</h1>
      <div class="sub">${de?"WooCommerce und LearnDash · letzte Änderung vor 2 Minuten":"WooCommerce and LearnDash · last change 2 minutes ago"}</div></div>
      <div style="text-align:right">
        <div><span class="b ${syncFailed()?'bad':'ok'}">${syncFailed()?(de?`${syncFailed()} Änderung nicht angekommen`:`${syncFailed()} change did not arrive`):(de?"Alles angekommen":"Everything arrived")}</span>${tip("syncfail","left")}</div>
        <div class="mut" style="margin-top:6px">${de?"Letzte 72 Stunden: 14 Änderungen, 1 offen":"Last 72 hours: 14 changes, 1 open"}</div>
      </div>
    </div>
    <div class="tabs">${tabBtn("log",de?"Verlauf":"Log")}${tabBtn("map",de?"Wo lebt was":"What lives where")}</div>
    ${body}
  </div>`;
}

/* ---------------- toast / modal / render ---------------- */
function say(msg, undo){ toast={msg,undo}; render(); clearTimeout(window._tt); window._tt=setTimeout(()=>{toast=null;render()},4200); }
function renderToast(){ return toast?`<div class="toast"><span>${toast.msg}</span>${toast.undo?`<button onclick="toast=null;render()">${t("undo")}</button>`:""}</div>`:""; }
function renderModal(){
  if(!modal) return "";
  return `<div class="modal"><div class="box">
    <h3>${modal.title}</h3><p>${modal.body}</p>
    <div class="acts"><button class="btn" onclick="modal=null;render()">${t("cancel")}</button>
    <button class="btn primary" id="okbtn">${modal.ok}</button></div>
  </div></div>`;
}

function render(){
  const pages = {
    today:pageToday, events:pageEvents, event:pageEvent, members:pageMembers,
    invoices:pageInvoices, approve:pageApprove, wizard:pageWizard, person:pagePerson,
    payments:pagePayments, people:pagePeople, help:pageHelp,
    insights:pageInsights, video:pageVideo, messages:pageMessages, mail:pageMail,
    certs:pageCerts, cert:pageCert, cancel:pageCancel, codes:pageCodes, promise:pagePromise, sync:pageSync
  };
  const p = (pages[view.name]||pageToday)();
  document.getElementById("app").innerHTML =
    `<div class="app">${rail()}<div class="main">${topbar()}${p}</div></div>${renderToast()}${renderModal()}`;
  const ok = document.getElementById("okbtn");
  if(ok && modal) ok.onclick = modal.act;
  document.querySelectorAll(".tip").forEach(el=>{
    const btn = el.querySelector("button"), bub = el.querySelector(".bub");
    if(!btn||!bub) return;
    const place = () => {
      const r = btn.getBoundingClientRect();
      const w = 268, gap = 9;
      let left = r.left + r.width/2 - w/2;
      left = Math.max(10, Math.min(left, window.innerWidth - w - 10));
      bub.style.left = left + "px";
      const below = r.bottom + gap;
      bub.style.top = below + "px";
      bub.style.visibility = "hidden"; bub.style.opacity = "0";
      const h = bub.offsetHeight;
      bub.style.visibility = ""; bub.style.opacity = "";
      if(below + h > window.innerHeight - 10) bub.style.top = (r.top - gap - h) + "px";
    };
    btn.addEventListener("mouseenter", place);
    btn.addEventListener("focus", place);
    btn.addEventListener("click", place);
  });
  document.querySelectorAll(".tablewrap").forEach(w=>{
    w.classList.toggle("scrolls", w.scrollWidth > w.clientWidth + 2);
    w.onscroll = () => w.classList.toggle("scrolls", w.scrollWidth - w.scrollLeft > w.clientWidth + 2);
  });
}

/* expose handlers for inline onclick (const/let bindings are not on window) */
Object.assign(window,{go,setLang,setRole,say,render,startWizard,finishWizard,askApprove,askSend,askCancel,icon,tip,genCode,
  get codeFilter(){return codeFilter}, set codeFilter(v){codeFilter=v},
  get syncTab(){return syncTab}, set syncTab(v){syncTab=v},
  get personTab(){return personTab}, set personTab(v){personTab=v},
  askSite,
  get promise(){return promise}, set promise(v){promise=v},
  get wizCode(){return wizCode}, set wizCode(v){wizCode=v},
  get wizEv(){return wizEv}, set wizEv(v){wizEv=v},
  get wizClaim(){return wizClaim}, set wizClaim(v){wizClaim=v},
  get cancelDate(){return cancelDate}, set cancelDate(v){cancelDate=v},
  get cancelMode(){return cancelMode}, set cancelMode(v){cancelMode=v},
  get transferTo(){return transferTo}, set transferTo(v){transferTo=v},
  get introOpen(){return introOpen}, set introOpen(v){introOpen=v},
  get credFilter(){return credFilter}, set credFilter(v){credFilter=v},
  toggleProgress,
  get memberFilter(){return memberFilter}, set memberFilter(v){memberFilter=v},
  get invFilter(){return invFilter}, set invFilter(v){invFilter=v},
  get wizardStep(){return wizardStep}, set wizardStep(v){wizardStep=v},
  get wizard(){return wizard}, set wizard(v){wizard=v},
  get toast(){return toast}, set toast(v){toast=v},
  get modal(){return modal}, set modal(v){modal=v}});
render();
</script>
